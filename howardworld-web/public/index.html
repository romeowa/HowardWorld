<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HowardWorld — 만들고 있는 앱들</title>
  <meta name="description" content="혼자 만드는 작은 앱들 — 피그맵, 니니구, 행운일기" />
  <meta property="og:title" content="HowardWorld" />
  <meta property="og:description" content="혼자 만드는 작은 앱들 — 피그맵, 니니구, 행운일기" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#f2f0ec" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f2f0ec; --card: #fbfaf7; --ink: #1b1a17; --muted: #6f6a5f;
      --line: #e6e2da; --accent: #0f766e; --accent-soft: #e3f0ee;
      --shadow: 0 1px 2px rgba(27,26,23,.04), 0 6px 20px rgba(27,26,23,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1916; --card: #23221e; --ink: #f3f1ec; --muted: #a39d92;
        --line: #332f29; --accent: #4db6a8; --accent-soft: #1f3a36;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased; line-height: 1.5;
      padding: 0 16px;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 64px 0 56px; }

    header { text-align: center; margin-bottom: 40px; }
    .kicker {
      display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: .22em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
    }
    h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; }
    header p { color: var(--muted); font-size: 16px; margin: 0; }

    .apps { display: flex; flex-direction: column; gap: 16px; }
    .app {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 20px; box-shadow: var(--shadow);
    }
    .app-top { display: flex; align-items: center; gap: 14px; }
    .app-icon {
      width: 58px; height: 58px; border-radius: 15px; flex: 0 0 auto; object-fit: cover;
      border: 1px solid var(--line); background: var(--bg);
      display: flex; align-items: center; justify-content: center; font-size: 30px;
    }
    .app-meta { min-width: 0; flex: 1; }
    .app-name { font-size: 18px; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
    .app-desc { color: var(--muted); font-size: 14px; margin-top: 3px; }
    .soon {
      font-size: 11px; font-weight: 600; color: var(--accent);
      background: var(--accent-soft); border-radius: 999px; padding: 3px 9px;
    }
    .app-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      font-size: 13.5px; font-weight: 600; padding: 9px 15px; border-radius: 11px;
      background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
      transition: transform .08s ease, opacity .15s ease;
    }
    .btn:active { transform: scale(.97); }
    .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    .app-note { color: var(--muted); font-size: 13px; margin-top: 14px; }

    footer { margin-top: 44px; text-align: center; color: var(--muted); font-size: 13px; }
    footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
    footer .copy { margin-top: 12px; font-size: 12px; opacity: .8; }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <span class="kicker">HowardWorld</span>
      <h1>만들고 있는 것들</h1>
      <p>혼자 만드는 작은 앱들</p>
    </header>

    <section class="apps">
      <!-- 피그맵 -->
      <article class="app">
        <div class="app-top">
          <img class="app-icon" src="/pigmap.jpg" alt="피그맵" width="58" height="58" />
          <div class="app-meta">
            <div class="app-name">피그맵 <span style="font-size:13px;font-weight:500;color:var(--muted)">Pigmap</span></div>
            <div class="app-desc">한국의 모든 핫플레이스 지도</div>
          </div>
        </div>
        <div class="app-links">
          <a class="btn" href="https://apps.apple.com/app/id6471933646" target="_blank" rel="noopener">App Store</a>
          <a class="btn ghost" href="https://play.google.com/store/apps/details?id=home.sweet.pigmap" target="_blank" rel="noopener">▶ Google Play</a>
        </div>
      </article>

      <!-- 니니구 -->
      <article class="app">
        <div class="app-top">
          <img class="app-icon" src="/ninigu.jpg" alt="니니구" width="58" height="58" />
          <div class="app-meta">
            <div class="app-name">니니구 <span style="font-size:13px;font-weight:500;color:var(--muted)">NINIGU</span></div>
            <div class="app-desc">친구가 이어주는 새로운 만남</div>
          </div>
        </div>
        <div class="app-links">
          <a class="btn" href="https://apps.apple.com/app/id6754002478" target="_blank" rel="noopener">App Store</a>
          <a class="btn ghost" href="https://ninigu.net" target="_blank" rel="noopener">🌐 ninigu.net</a>
        </div>
      </article>

      <!-- 행운일기 -->
      <article class="app">
        <div class="app-top">
          <div class="app-icon" aria-hidden="true">🍀</div>
          <div class="app-meta">
            <div class="app-name">행운일기 <span class="soon">준비 중</span></div>
            <div class="app-desc">매일의 행운을 기록하는 일기</div>
          </div>
        </div>
        <div class="app-note">곧 만나요. 출시되면 여기에서 받을 수 있어요.</div>
      </article>
    </section>

    <footer>
      <a href="https://howard-trips.web.app" target="_blank" rel="noopener">여행 일정 →</a>
      <div class="copy">© HowardWorld</div>
    </footer>
  </main>
</body>
</html>
