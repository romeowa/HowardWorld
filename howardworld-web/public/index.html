    #frame.hw-hit{animation:none!important}
    .hw-reveal{opacity:1!important;transform:none!important}

      return '<a href="' + esc(c.href) + '" target="' + c.target + '" rel="noopener" class="hw-contact" style="display:flex;align-items:baseline;gap:12px;padding:12px 0;text-decoration:none;border-bottom:1px solid rgba(28,26,23,.22)"><div style="font-family:\'Song Myung\',serif;font-size:15px;color:#b8322a;flex:none;min-width:64px">' + esc(c.label) + '</div><div style="font-weight:800;font-size:clamp(14px,1.4vw,16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.value) + '</div></a>';

    var inkSVG ='<svg class="hw-ink" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true" style="height:clamp(120px,22vw,230px)">' +

    var html =

          '<div class="hw-anim-rise" style="animation-delay:.08s;width:clamp(56px,7vw,80px);border-top:2px solid #1c1a17"></div>' +

          '<div style="flex:none;display:flex;gap:clamp(10px,1.6vw,18px);align-items:flex-start;align-self:stretch;border-left:1px solid #1c1a17;padding-left:clamp(14px,2.4vw,28px)">' +

        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:clamp(30px,4vw,44px) clamp(24px,4vw,48px)">' + appsHTML + '</div>' +
      '</section>' +
      '<section class="hw-reveal" style="display:flex;flex-direction:column;gap:clamp(14px,2vw,22px)">' +
        '<div style="display:flex;align-items:center;gap:clamp(12px,1.6vw,18px)"><h2 style="margin:0;font-weight:400;font-family:\'Song Myung\',serif;font-size:clamp(26px,3vw,32px)">' + esc(T.contact) + '</h2><div style="flex:1;border-top:1px solid #1c1a17"></div></div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:4px clamp(24px,4vw,48px)">' + contacts + '</div>' +
      '</section>' +
      '<section class="hw-reveal" style="display:flex;flex-direction:column;gap:clamp(14px,2vw,22px)">' +
        '<div style="display:flex;align-items:center;gap:clamp(12px,1.6vw,18px)"><h2 style="margin:0;font-weight:400;font-family:\'Song Myung\',serif;font-size:clamp(26px,3vw,32px)">' + esc(T.gb.title) + '</h2><div style="flex:1;border-top:1px solid #1c1a17"></div><span id="gb-admin-toggle" role="button" style="font-size:12px;color:#a89e86;cursor:pointer;white-space:nowrap">' + esc(T.gb.adminIn) + '</span></div>' +

            '<input id="gb-nick" class="gb-in" maxlength="20" placeholder="' + esc(T.gb.nick) + '" style="flex:2 1 150px">' +
            '<input id="gb-pw" class="gb-in" type="password" maxlength="64" placeholder="' + esc(T.gb.pw) + '" style="flex:1 1 120px">' +
          '</div>' +
          '<input id="gb-hp" class="gb-in" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;top:0;width:1px;height:1px;opacity:0;padding:0;border:0">' +
          '<textarea id="gb-body" class="gb-in" maxlength="500" rows="2" placeholder="' + esc(T.gb.body) + '" style="resize:vertical;min-height:2.6em"></textarea>' +
          '<div style="display:flex;align-items:center;gap:12px"><label style="display:flex;align-items:center;gap:6px;font-size:14px;color:#4a4236;cursor:pointer;margin-right:auto"><input type="checkbox" id="gb-secret" style="width:16px;height:16px;accent-color:#b8322a">' + esc(T.gb.secret) + '</label><span id="gb-msg" style="font-size:13px;color:#b8322a"></span><button id="gb-submit" type="submit" class="gb-btn">' + esc(T.gb.post) + '</button></div>' +
        '</form>' +
      '</section>' +
      '<footer class="hw-reveal" style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">' +
        '<div style="font-size:12px;color:#6f6a5f">© HowardWorld</div>' +
        '<div style="border:1px solid #1c1a17;padding:clamp(10px,1.3vw,14px) clamp(9px,1.1vw,12px);display:flex;gap:clamp(7px,.9vw,10px);align-items:flex-start">' +
          '<div style="writing-mode:vertical-rl;font-family:\'Song Myung\',serif;font-size:clamp(13px,1.4vw,16px);line-height:1.4;letter-spacing:.1em;white-space:nowrap">' + esc(T.colo1) + '</div>' +
          '<div style="writing-mode:vertical-rl;font-family:\'Song Myung\',serif;font-size:clamp(13px,1.4vw,16px);line-height:1.4;letter-spacing:.1em;white-space:nowrap">' + esc(T.colo2) + '</div>' +
          '<img src="./assets/seal-howard.png?v=2" alt="' + esc(T.sealSm) + '" style="width:clamp(28px,3vw,36px);height:auto;align-self:flex-end;transform:rotate(-4deg)"/>' +
        '</div>' +
      '</footer>';

    var frame = document.getElementById("frame");
    frame.innerHTML = html;
    document.documentElement.lang = curLang();
    frame.querySelector(".hw-ko").addEventListener("click", function () { setLang("ko"); });
    frame.querySelector(".hw-en").addEventListener("click", function () { setLang("en"); });
    frame.querySelectorAll(".hw-open").forEach(function (b) { b.addEventListener("click", function () { openReader(b.dataset.k); }); });
    // 스크롤하면 섹션이 사뿐히 떠오름
    var revEls = frame.querySelectorAll(".hw-reveal");
    if (!("IntersectionObserver" in window)) { revEls.forEach(function (e) { e.classList.add("hw-in"); }); }
    else {
      var io = new IntersectionObserver(function (ents) {
        ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add("hw-in"); io.unobserve(en.target); } });
      }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
      revEls.forEach(function (e) { io.observe(e); });
    }
    // 도장이 내리꽂히는 순간 화면이 '쾅' 울린다 (도장 애니메이션 임팩트와 동기화)
    if (!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) {
      clearTimeout(St.hitTm);
      St.hitTm = setTimeout(function () {
        frame.classList.add("hw-hit");
        setTimeout(function () { frame.classList.remove("hw-hit"); }, 520);
      }, 905);
    }
    gbInit(frame);
  }

  function setLang(l) { try { localStorage.setItem("hw-lang", l); } catch (e) {} St.lang = l; render(); }

  window.addEventListener("resize", function () { St.vw = window.innerWidth; St.vh = window.innerHeight; if (St.reader) { St.flip = null; apply(); } });
  window.addEventListener("keydown", function (e) {
    if (!St.reader) return;
    if (e.key === "Escape") closeReader();
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });

  try { St.lang = localStorage.getItem("hw-lang"); } catch (e) {}
  render();
})();
</script>
