      return '<a href="' + esc(c.href) + '" target="' + c.target + '" rel="noopener" class="hw-contact" style="display:flex;align-items:baseline;gap:12px;padding:12px 0;text-decoration:none;border-bottom:1px solid rgba(28,26,23,.22)"><div style="font-family:\'Song Myung\',serif;font-size:15px;color:#b8322a;flex:none;min-width:64px">' + esc(c.label) + '</div><div style="font-weight:800;font-size:clamp(14px,1.4vw,16px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(c.value) + '</div></a>';

    var aboutHTML = (T.about || []).map(function (p) { return '<p style="margin:0;font-size:clamp(15px,1.55vw,18px);line-height:1.9;text-wrap:pretty">' + esc(p) + '</p>'; }).join("");

    var html =
      '<header style="display:flex;align-items:center;gap:2px;font-size:14px">' +

        '<div class="hw-en" style="cursor:pointer;font-weight:800;text-decoration:' + (ko ? "none" : "underline") + ';text-underline-offset:4px;padding:12px 8px">EN</div>' +
        '<div style="flex:1"></div><div style="letter-spacing:.25em;font-size:clamp(12px,1.2vw,14px)">' + esc(T.era) + '</div>' +
      '</header>' +
      '<section style="display:flex;flex-wrap:wrap-reverse;gap:clamp(28px,4vw,44px);align-items:stretch">' +
        '<div style="flex:999 1 340px;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(14px,1.8vw,20px)">' +
          '<div style="font-family:\'Nanum Brush Script\',cursive;font-size:clamp(44px,6vw,70px);line-height:1.05;text-wrap:balance">' + esc(T.motto) + '</div>' +
          '<div style="width:clamp(56px,7vw,80px);border-top:2px solid #1c1a17"></div>' +
          '<div style="font-size:clamp(16px,1.7vw,20px);line-height:1.7">' + esc(T.role) + '</div>' +
        '</div>' +
        '<div style="flex:1 1 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:clamp(18px,4vw,44px)">' +
          '<div style="flex:none;width:clamp(140px,17vw,200px);aspect-ratio:200/260;border:1px solid #1c1a17;padding:clamp(5px,.7vw,8px);box-sizing:border-box"><img src="./assets/howard.jpg" alt="' + esc(T.photoAlt) + '" style="display:block;width:100%;height:100%;object-fit:cover;object-position:40% 20%;filter:sepia(.35) saturate(.85)"></div>' +
          '<div style="flex:none;display:flex;gap:clamp(10px,1.6vw,18px);align-items:flex-start;align-self:stretch;border-left:1px solid #1c1a17;padding-left:clamp(14px,2.4vw,28px)">' +
            '<h1 style="margin:0;font-weight:400;writing-mode:vertical-rl;font-family:\'Song Myung\',serif;font-size:' + titleFs + ';line-height:1;letter-spacing:.05em;white-space:nowrap">' + esc(T.title) + '</h1>' +
            '<div style="flex:none;width:clamp(44px,5.5vw,66px);height:clamp(44px,5.5vw,66px);background:#b8322a;color:#efe6d2;display:flex;align-items:center;justify-content:center;font-family:\'Song Myung\',serif;font-size:clamp(12px,1.4vw,17px);line-height:1;writing-mode:vertical-rl;white-space:nowrap;border-radius:4px;transform:rotate(-3deg);box-shadow:inset 0 0 0 3px #efe6d2,inset 0 0 0 5px #b8322a;margin-top:auto">' + esc(T.seal) + '</div>' +
          '</div>' +
        '</div>' +
      '</section>' +
      '<section style="display:flex;flex-direction:column;gap:clamp(16px,2vw,24px)">' +
        '<div style="display:flex;align-items:center;gap:clamp(12px,1.6vw,18px)"><h2 style="margin:0;font-weight:400;font-family:\'Song Myung\',serif;font-size:clamp(26px,3vw,32px)">' + esc(T.preface) + '</h2><div style="flex:1;border-top:1px solid #1c1a17"></div></div>' +
        '<div style="display:flex;flex-direction:column;gap:clamp(10px,1.3vw,16px);max-width:760px">' + aboutHTML + '</div>' +
      '</section>' +
      '<section style="display:flex;flex-direction:column;gap:clamp(24px,3.5vw,40px)">' +
        '<div style="display:flex;align-items:center;gap:clamp(12px,1.6vw,18px)"><h2 style="margin:0;font-weight:400;font-family:\'Song Myung\',serif;font-size:clamp(26px,3vw,32px)">' + esc(T.works) + '</h2><div style="flex:1;border-top:1px solid #1c1a17"></div><div style="font-size:clamp(13px,1.3vw,15px)">' + esc(T.count) + '</div></div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:clamp(30px,4vw,44px) clamp(24px,4vw,48px)">' + appsHTML + '</div>' +
      '</section>' +
      '<section style="display:flex;flex-direction:column;gap:clamp(14px,2vw,22px)">' +
        '<div style="display:flex;align-items:center;gap:clamp(12px,1.6vw,18px)"><h2 style="margin:0;font-weight:400;font-family:\'Song Myung\',serif;font-size:clamp(26px,3vw,32px)">' + esc(T.contact) + '</h2><div style="flex:1;border-top:1px solid #1c1a17"></div></div>' +
        '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:4px clamp(24px,4vw,48px)">' + contacts + '</div>' +
      '</section>' +
      '<footer style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">' +
        '<div style="font-size:12px;color:#6f6a5f">© HowardWorld</div>' +
        '<div style="border:1px solid #1c1a17;padding:clamp(10px,1.3vw,14px) clamp(9px,1.1vw,12px);display:flex;gap:clamp(7px,.9vw,10px);align-items:flex-start">' +
          '<div style="writing-mode:vertical-rl;font-family:\'Song Myung\',serif;font-size:clamp(13px,1.4vw,16px);line-height:1.4;letter-spacing:.1em;white-space:nowrap">' + esc(T.colo1) + '</div>' +
          '<div style="writing-mode:vertical-rl;font-family:\'Song Myung\',serif;font-size:clamp(13px,1.4vw,16px);line-height:1.4;letter-spacing:.1em;white-space:nowrap">' + esc(T.colo2) + '</div>' +
          '<div style="width:clamp(24px,2.6vw,30px);height:clamp(24px,2.6vw,30px);background:#b8322a;color:#efe6d2;border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:\'Song Myung\',serif;font-size:clamp(10px,1.1vw,12px);align-self:flex-end;transform:rotate(-4deg)">' + esc(T.sealSm) + '</div>' +
        '</div>' +
      '</footer>';

    var frame = document.getElementById("frame");
    frame.innerHTML = html;
    document.documentElement.lang = curLang();
    frame.querySelector(".hw-ko").addEventListener("click", function () { setLang("ko"); });
    frame.querySelector(".hw-en").addEventListener("click", function () { setLang("en"); });
    frame.querySelectorAll(".hw-open").forEach(function (b) { b.addEventListener("click", function () { openReader(b.dataset.k); }); });
  }

  function setLang(l) { try { localStorage.setItem("hw-lang", l); } catch (e) {} St.lang = l; render(); }

  window.addEventListener("resize", function () { St.vw = window.innerWidth; St.vh = window.innerHeight; if (St.reader) apply(); });
  window.addEventListener("keydown", function (e) {
    if (!St.reader) return;
    if (e.key === "Escape") closeReader();
    else if (e.key === "ArrowRight") go(1);
    else if (e.key === "ArrowLeft") go(-1);
  });

  try { St.lang = localStorage.getItem("hw-lang"); } catch (e) {}
  render();
})();
</script>
